<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Boda - Álbum Compartido</title>

  <!-- Tailwind CSS para diseño moderno rápido -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Widget oficial de subida de Cloudinary -->
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen flex flex-col items-center p-4">

  <!-- Encabezado de la Boda -->
  <header class="text-center my-8">
    <h1 class="font-serif text-4xl md:text-5xl text-amber-900 font-bold mb-2">¡Nuestra Boda!</h1>
    <p class="text-slate-600 text-lg">Ayúdanos a guardar cada momento. Sube tus fotos y videos aquí.</p>
  </header>

  <!-- Botón Principal para Subir Contenido -->
  <main class="w-full max-w-md text-center">
    <button id="upload_widget" class="w-full bg-amber-700 hover:bg-amber-800 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transition transform active:scale-95 text-xl flex items-center justify-center gap-2 mb-8">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      Subir Foto o Video
    </button>

    <h2 class="text-2xl font-serif text-slate-700 mb-4 border-b pb-2">Álbum en Vivo</h2>
    
    <!-- Galería Grilla -->
    <div id="gallery" class="grid grid-cols-2 md:grid-cols-3 gap-3">
      <!-- Aquí se insertan dinámicamente las fotos cargadas -->
    </div>
  </main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // CLOUDINARY
  const cloudName = "cb6z5cjj";
  const uploadPreset = "boda_preset";

  // SUPABASE: reemplaza estos dos valores
  const SUPABASE_URL = "TU_PROJECT_URL";
  const SUPABASE_KEY = "TU_PUBLISHABLE_KEY";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const gallery = document.getElementById("gallery");

  // Evitar mostrar dos veces el mismo registro
  const displayedPhotos = new Set();

  // Mostrar fotografías y vídeos
  function addImageToGallery(photo) {
    if (displayedPhotos.has(photo.id)) return;

    displayedPhotos.add(photo.id);

    const container = document.createElement("div");
    container.className =
      "relative rounded-xl overflow-hidden shadow bg-gray-200 aspect-square";

    if (photo.tipo === "video") {
      const video = document.createElement("video");
      video.src = photo.url;
      video.className = "w-full h-full object-cover";
      video.controls = true;
      container.appendChild(video);
    } else {
      const img = document.createElement("img");
      img.src = photo.url;
      img.alt = "Fotografía de nuestra boda";
      img.loading = "lazy";
      img.className = "w-full h-full object-cover";
      container.appendChild(img);
    }

    gallery.prepend(container);
  }

  // Cargar las fotografías que ya existen
  async function loadGallery() {
    const { data, error } = await supabaseClient
      .from("fotos")
      .select("*")
      .order("fecha", { ascending: false });

    if (error) {
      console.error("Error cargando álbum:", error);
      return;
    }

    data.forEach(addImageToGallery);
  }

  // Escuchar nuevas fotografías de otros dispositivos
  supabaseClient
    .channel("album-boda")
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "fotos"
      },
      (payload) => {
        addImageToGallery(payload.new);
      }
    )
    .subscribe();

  // Configurar widget de Cloudinary
  const myWidget = cloudinary.createUploadWidget({
    cloudName: cloudName,
    uploadPreset: uploadPreset,
    sources: ["local", "camera"],
    multiple: true,
    maxFiles: 10,
    resourceType: "auto"
  }, async (error, result) => {

    if (error) {
      console.error("Error Cloudinary:", error);
      return;
    }

    if (result && result.event === "success") {

      // Registrar la URL en Supabase
      const { data, error } = await supabaseClient
        .from("fotos")
        .insert({
          url: result.info.secure_url,
          tipo: result.info.resource_type
        })
        .select()
        .single();

      if (error) {
        console.error("Error guardando registro:", error);
        alert("La foto se subió, pero no se pudo registrar en el álbum.");
        return;
      }

      // Mostrar inmediatamente en el dispositivo que subió
      addImageToGallery(data);
    }
  });

  // Abrir widget
  document
    .getElementById("upload_widget")
    .addEventListener("click", () => {
      myWidget.open();
    });

  // Cargar álbum al entrar
  loadGallery();

</script>

</body>
</html>
